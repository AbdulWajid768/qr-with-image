name: Update README assets

on:
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats cards
        run: |
          mkdir -p assets
          curl -fsSL "https://gh-stats.work/api/pin/?username=AbdulWajid768&repo=qr-with-image&theme=neon&hide_border=true&bg_color=0a0a0f&title_color=ff006e&icon_color=00d4aa&text_color=e2e8f0&border_radius=12" -o assets/stats-pin.svg
          curl -fsSL "https://gh-stats.work/api/top-langs/?username=AbdulWajid768&theme=neon&hide_border=true&bg_color=0a0a0f&title_color=ff006e&text_color=e2e8f0&layout=compact&border_radius=12" -o assets/stats-top-langs.svg

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1
        with:
          username: AbdulWajid768
          options: theme=neon&hide_border=true&bg_color=0a0a0f&color=ff006e&line=00d4aa&point=7c3aed&area=true&height=260
          output_path: assets/github-activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-pin.svg assets/stats-top-langs.svg assets/github-activity-graph.svg
          git diff --staged --quiet && echo "No asset changes" && exit 0
          git commit -m "chore(docs): refresh README assets"
          git push
